[project]
name = "sentinel-26145"
version = "1.0.0"
description = "Passive threat detection for one-way (tap / data-diode) IP traffic - SIH problem statement 26145"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.20",
    "dpkt>=1.9.8",
    "numpy>=1.26",
    "tldextract>=5.1",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["scipy>=1.14", "scikit-learn>=1.5", "pytest>=8", "httpx>=0.27"]

[project.scripts]
sentinel = "sentinel.__main__:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["intel/*.csv", "intel/*.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
