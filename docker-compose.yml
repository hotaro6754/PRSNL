services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command:
    - bash
    - -c
    - uvicorn backend.main:app --host 0.0.0.0 --port 8000
    container_name: cyberos-backend
    depends_on:
      mongodb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
    - APP_ENV=${APP_ENV:-PRODUCTION}
    - MONGO_URI=${MONGODB_URI:-mongodb://mongodb:27017}
    - MONGO_DB=cyberos
    - KAFKA_BROKERS=${REDPANDA_BROKERS:-redpanda:9092}
    - KAFKA_TOPIC_OBSERVATIONS=${KAFKA_TOPIC_OBSERVATIONS:-network-observations}
    - KAFKA_TOPIC_FEATURES=${KAFKA_TOPIC_FEATURES:-ml-feature-vectors}
    - KAFKA_TOPIC_PREDICTIONS=${KAFKA_TOPIC_PREDICTIONS:-ml-predictions}
    healthcheck:
      interval: 15s
      retries: 3
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      timeout: 5s
    logging: &id001
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    ports:
    - 8000:8000
    restart: unless-stopped
    cap_add:
    - NET_ADMIN
    - NET_RAW
    volumes:
    - ./backend:/app/backend
    - ./models:/app/models
    - ./data:/app/data
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command:
    - node_modules/.bin/next
    - start
    - -H
    - 0.0.0.0
    container_name: cyberos-frontend
    depends_on:
    - backend
    environment:
    - NEXT_PUBLIC_API_URL=${API_BASE_URL:-http://localhost:8000}
    logging: *id001
    ports:
    - 3000:3000
    restart: unless-stopped
    volumes:
    - ./frontend:/app
    - /app/node_modules
  grafana:
    container_name: cyberos-grafana
    depends_on:
    - prometheus
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=admin
    - GF_SECURITY_ALLOW_EMBEDDING=true
    - GF_AUTH_ANONYMOUS_ENABLED=true
    image: grafana/grafana:latest
    logging: *id001
    ports:
    - 3001:3000
    restart: unless-stopped
    volumes:
    - grafana_data:/var/lib/grafana
    - ./grafana/provisioning:/etc/grafana/provisioning
  init-redpanda:
    command:
    - rpk topic create ml-feature-vectors network-observations --brokers=redpanda:9092
      || true
    container_name: cyberos-init-redpanda
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint:
    - sh
    - -c
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    restart: on-failure
  lab_dns:
    command: -dns.port 53
    container_name: cyberos-lab-dns
    image: coredns/coredns
    logging: *id001
    restart: unless-stopped
  ml_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    cap_drop:
    - ALL
    command:
    - bash
    - -c
    - python -m backend.ml.inference_worker
    container_name: cyberos-ml-worker
    depends_on:
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
    - APP_ENV=${APP_ENV:-PRODUCTION}
    - KAFKA_BROKERS=redpanda:9092
    - MONGO_URI=${MONGODB_URI:-mongodb://mongodb:27017}
    logging: *id001
    restart: unless-stopped
    security_opt:
    - seccomp=unconfined
    user: 1000:1000
    volumes:
    - ./models:/app/models
    - ./backend:/app/backend
  mongodb:
    container_name: cyberos-mongodb
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - mongosh
      - --eval
      - db.adminCommand('ping')
      timeout: 5s
    image: mongo:7
    logging: *id001
    ports:
    - 27017:27017
    restart: unless-stopped
    volumes:
    - mongo_data:/data/db
  prometheus:
    container_name: cyberos-prometheus
    image: prom/prometheus:latest
    logging: *id001
    ports:
    - 9090:9090
    restart: unless-stopped
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
  redis:
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --appendfsync
    - everysec
    container_name: cyberos-redis
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: redis:7-alpine
    logging: *id001
    ports:
    - 6379:6379
    restart: unless-stopped
    volumes:
    - redis_data:/data
  redpanda:
    command:
    - redpanda
    - start
    - --smp 1
    - --memory 512M
    - --overprovisioned
    - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
    - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    container_name: cyberos-redpanda
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - rpk
      - cluster
      - health
      timeout: 5s
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    logging: *id001
    ports:
    - 19092:19092
    - 9644:9644
    restart: unless-stopped
    volumes:
    - redpanda_data:/var/lib/redpanda/data
  zeek:
    build:
      context: .
      dockerfile: Dockerfile.zeek
    cap_add:
    - NET_ADMIN
    - NET_RAW
    command:
    - 'mkdir -p /var/log/zeek &&  cd /var/log/zeek &&  echo ''redef tcp_attempt_delay
      = 5 sec;'' > /usr/local/zeek/share/zeek/site/local.zeek && echo ''redef tcp_close_delay
      = 5 sec;'' >> /usr/local/zeek/share/zeek/site/local.zeek && zeek -i eth0 -C
      LogAscii::use_json=T local

      '
    container_name: cyberos-zeek
    entrypoint:
    - sh
    - -c
    logging: *id001
    restart: unless-stopped
    volumes:
    - zeek_logs:/var/log/zeek
  zeek_adapter:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command:
    - bash
    - -c
    - python -m backend.streaming.zeek_adapter
    container_name: cyberos-zeek-adapter
    depends_on:
      redpanda:
        condition: service_healthy
      zeek:
        condition: service_started
    environment:
    - APP_ENV=${APP_ENV:-PRODUCTION}
    - KAFKA_BROKERS=redpanda:9092
    - ZEEK_LOG_PATH=/var/log/zeek/conn.log
    logging: *id001
    restart: unless-stopped
    volumes:
    - zeek_logs:/var/log/zeek:ro
    - ./backend:/app/backend
version: '3.9'
volumes:
  grafana_data: null
  mongo_data: null
  prometheus_data: null
  redis_data: null
  redpanda_data: null
  zeek_logs: null
x-logging: *id001
