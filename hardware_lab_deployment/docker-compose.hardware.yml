version: "3.8"
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.1.2
    container_name: sih26145-redpanda
    network_mode: host
    command: ["redpanda", "start", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--overprovisioned", "--node-id", "0", "--kafka-addr", "PLAINTEXT://0.0.0.0:9092", "--advertise-kafka-addr", "PLAINTEXT://127.0.0.1:9092"]
    restart: always
  zeek:
    build:
      context: ../
      dockerfile: Dockerfile.zeek
    container_name: sih26145-zeek-sensor
    network_mode: host
    cap_add: ["NET_ADMIN", "NET_RAW"]
    working_dir: /var/log/zeek
    command: ["/usr/local/zeek/bin/zeek", "-i", "${MONITOR_INTERFACE:-eth1}", "-C", "LogAscii::use_json=T", "local"]
    volumes: ["zeek_logs:/var/log/zeek:rw"]
    restart: always
  zeek_adapter:
    build:
      context: ../
      dockerfile: Dockerfile.backend
    container_name: sih26145-adapter
    command: ["python", "-m", "backend.streaming.zeek_adapter"]
    environment:
      - KAFKA_BROKERS=127.0.0.1:9092
      - ZEEK_LOG_PATH=/var/log/zeek/conn.log
    volumes: ["zeek_logs:/var/log/zeek:ro", "../backend:/app/backend:ro"]
    restart: always
  redis:
    image: redis:7.0-alpine
    container_name: sih26145-redis
    network_mode: host
    restart: always
  mongodb:
    image: mongo:6.0
    container_name: sih26145-mongo
    network_mode: host
    restart: always
  backend:
    build:
      context: ../
      dockerfile: Dockerfile.backend
    container_name: sih26145-backend
    network_mode: host
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment: ["KAFKA_BROKERS=127.0.0.1:9092", "REDIS_URL=redis://127.0.0.1:6379", "MONGO_URI=mongodb://127.0.0.1:27017"]
    restart: always
  ml_worker:
    build:
      context: ../
      dockerfile: Dockerfile.backend
    network_mode: host
    command: ["python", "-m", "backend.ml.inference_worker"]
    environment: ["KAFKA_BROKERS=127.0.0.1:9092", "REDIS_URL=redis://127.0.0.1:6379", "MONGO_URI=mongodb://127.0.0.1:27017"]
    deploy: { replicas: 4 }
    restart: always
volumes:
  zeek_logs:

